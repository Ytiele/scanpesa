name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner ships an Android SDK; use its sdkmanager directly.
      - name: Install SDK platform 37.2 and build-tools
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms/android-37.2" "build-tools/37.0.0" \
            || "$SDKM" "platforms;android-37.2" "build-tools;37.0.0"
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk ScanPesa-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScanPesa-apk
          path: ScanPesa-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScanPesa build ${{ github.run_number }}
          body: |
            Debug build from commit ${{ github.sha }}.
            On your phone: download the APK below, open it and allow "Install unknown apps" for your browser.
          files: ScanPesa-${{ github.run_number }}.apk
          make_latest: true
